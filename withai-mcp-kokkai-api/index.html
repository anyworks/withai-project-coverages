<!DOCTYPE html><html><head><title>Coverage Reports - withai-mcp-kokkai-api</title><style>body{font-family:Arial,sans-serif;margin:40px}h1{color:#333}.pr-list{list-style:none;padding:0}.pr-list li{margin:10px 0}.pr-list a{text-decoration:none;color:#0366d6}.pr-list a:hover{text-decoration:underline}</style></head><body><h1>Coverage Reports - withai-mcp-kokkai-api</h1><p>Select a PR to view its coverage report:</p><ul class="pr-list" id="prList"></ul><script>fetch(".").then(r=>r.text()).then(h=>{const p=new DOMParser();const d=p.parseFromString(h,"text/html");const l=Array.from(d.querySelectorAll("a")).filter(a=>a.href.includes("pr-")).map(a=>a.href.split("/").pop());const ul=document.getElementById("prList");l.forEach(pr=>{const li=document.createElement("li");const a=document.createElement("a");a.href=pr+"/";a.textContent=pr.replace("pr-","Pull Request #");li.appendChild(a);ul.appendChild(li)})});</script></body></html>
