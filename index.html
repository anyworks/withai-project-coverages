<!DOCTYPE html><html><head><title>Coverage Reports</title><style>body{font-family:Arial,sans-serif;margin:40px}h1{color:#333}.repo-list{list-style:none;padding:0}.repo-list li{margin:10px 0}.repo-list a{text-decoration:none;color:#0366d6;font-size:18px}.repo-list a:hover{text-decoration:underline}</style></head><body><h1>Coverage Reports</h1><p>Select a repository to view its coverage reports:</p><ul class="repo-list" id="repoList"></ul><script>fetch(".").then(r=>r.text()).then(h=>{const p=new DOMParser();const d=p.parseFromString(h,"text/html");const l=Array.from(d.querySelectorAll("a")).filter(a=>!a.href.includes("index.html")&&a.href.endsWith("/")).map(a=>a.href.split("/").filter(p=>p).pop());const ul=document.getElementById("repoList");l.forEach(repo=>{if(repo){const li=document.createElement("li");const a=document.createElement("a");a.href=repo+"/";a.textContent=repo;li.appendChild(a);ul.appendChild(li)}})});</script></body></html>
